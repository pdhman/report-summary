<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X 팔로잉 모니터링</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --sub: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --oo: #b45309; --oo-bg: #fef3c7;
    --o-bg: #eef2f7; --chip: #eef2f7; --chip-on: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e7e9ee; --sub: #9aa2af;
      --border: #262b35; --accent: #60a5fa; --oo: #fbbf24; --oo-bg: #3a2e10;
      --o-bg: #232936; --chip: #232936; --chip-on: #2563eb;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text);
         font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; }
  .meta { color: var(--sub); font-size: 13px; }
  .stats { display: flex; gap: 20px; margin: 14px 0; flex-wrap: wrap; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 10px 16px; min-width: 110px; }
  .stat b { font-size: 20px; display: block; }
  .stat span { font-size: 12px; color: var(--sub); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
  .filters select, .filters input {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .filters input { flex: 1; min-width: 160px; }
  .gradebtn { border: 1px solid var(--border); background: var(--chip); color: var(--text);
              border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .gradebtn.on { background: var(--chip-on); color: #fff; border-color: var(--chip-on); }
  .datehdr { margin: 22px 0 10px; font-size: 14px; font-weight: 600; color: var(--sub);
             border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; }
  .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .who { line-height: 1.2; }
  .who b { font-size: 14px; }
  .who .h { color: var(--sub); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
  .badge.g2 { background: var(--oo-bg); color: var(--oo); }
  .badge.g1 { background: var(--o-bg); color: var(--sub); }
  .time { margin-left: auto; color: var(--sub); font-size: 12px; white-space: nowrap; }
  .text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .cats { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .cat { font-size: 11px; background: var(--chip); color: var(--sub);
         border-radius: 6px; padding: 2px 8px; }
  .link { font-size: 12px; color: var(--accent); text-decoration: none; margin-left: auto; }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>X 팔로잉 모니터링</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <button class="gradebtn on" data-g="0">전체</button>
    <button class="gradebtn" data-g="2">★★ 중요</button>
    <button class="gradebtn" data-g="1">★ 참고</button>
    <select id="fCat"><option value="">분야 전체</option></select>
    <select id="fAcc"><option value="">계정 전체</option></select>
    <select id="fDate"><option value="">날짜 전체</option></select>
    <input id="fSearch" type="search" placeholder="검색어...">
  </div>
  <div id="feed"></div>
</div>
<script src="data.js"></script>
<script>
(function () {
  var D = window.XMON_DATA || { accounts: [], posts: [] };
  var accByHandle = {};
  D.accounts.forEach(function (a) { accByHandle[a.handle.toLowerCase()] = a; });

  var state = { grade: 0, cat: '', acc: '', date: '', q: '' };

  function kstDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return new Date(d.getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  }
  function kstTime(iso) {
    if (!iso) return '';
    var d = new Date(new Date(iso).getTime() + 9 * 3600 * 1000);
    return d.toISOString().slice(5, 16).replace('T', ' ');
  }
  function esc(s) {
    return (s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // 필터 옵션 채우기
  var cats = {};
  D.accounts.forEach(function (a) { (a.categories || []).forEach(function (c) { cats[c] = 1; }); });
  Object.keys(cats).sort().forEach(function (c) {
    document.getElementById('fCat').insertAdjacentHTML('beforeend',
      '<option value="' + esc(c) + '">' + esc(c) + '</option>');
  });
  D.accounts.forEach(function (a) {
    document.getElementById('fAcc').insertAdjacentHTML('beforeend',
      '<option value="' + esc(a.handle) + '">' + (a.grade === 2 ? '★★ ' : '') + esc(a.name) + '</option>');
  });
  var dates = {};
  D.posts.forEach(function (p) { dates[kstDate(p.time)] = 1; });
  Object.keys(dates).sort().reverse().forEach(function (d) {
    document.getElementById('fDate').insertAdjacentHTML('beforeend',
      '<option value="' + d + '">' + d + '</option>');
  });

  function render() {
    var posts = D.posts.filter(function (p) {
      var a = accByHandle[(p.handle || '').toLowerCase()];
      if (state.grade && (!a || a.grade !== state.grade)) return false;
      if (state.cat && (!a || (a.categories || []).indexOf(state.cat) < 0)) return false;
      if (state.acc && (p.handle || '').toLowerCase() !== state.acc.toLowerCase()) return false;
      if (state.date && kstDate(p.time) !== state.date) return false;
      if (state.q) {
        var q = state.q.toLowerCase();
        var hay = ((p.text || '') + ' ' + (p.handle || '') + ' ' + (a ? a.name : '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });

    var today = kstDate(new Date().toISOString());
    var todayCnt = D.posts.filter(function (p) { return kstDate(p.time) === today; }).length;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><b>' + D.posts.length + '</b><span>누적 수집</span></div>' +
      '<div class="stat"><b>' + todayCnt + '</b><span>오늘</span></div>' +
      '<div class="stat"><b>' + posts.length + '</b><span>필터 결과</span></div>' +
      '<div class="stat"><b>' + D.accounts.length + '</b><span>모니터링 계정</span></div>';

    var html = '', lastDate = '';
    posts.forEach(function (p) {
      var a = accByHandle[(p.handle || '').toLowerCase()] || {};
      var d = kstDate(p.time);
      if (d !== lastDate) { html += '<div class="datehdr">' + d + '</div>'; lastDate = d; }
      var name = a.name || p.name || p.handle;
      html += '<div class="card">' +
        '<div class="row1">' +
          '<div class="avatar">' + esc((name || '?').charAt(0).toUpperCase()) + '</div>' +
          '<div class="who"><b>' + esc(name) + '</b> ' +
            (a.grade === 2 ? '<span class="badge g2">★★</span>' :
             a.grade === 1 ? '<span class="badge g1">★</span>' : '') +
            '<div class="h">@' + esc(p.handle) + '</div></div>' +
          '<span class="time">' + kstTime(p.time) + '</span>' +
        '</div>' +
        '<div class="text">' + esc(p.text) + '</div>' +
        '<div class="cats">' +
          (a.categories || []).map(function (c) { return '<span class="cat">' + esc(c) + '</span>'; }).join('') +
          (p.url ? '<a class="link" href="' + esc(p.url) + '" target="_blank">원문 ↗</a>' : '') +
        '</div></div>';
    });
    document.getElementById('feed').innerHTML =
      html || '<div class="empty">표시할 글이 없습니다. 모니터링을 실행하면 여기에 쌓입니다.</div>';
  }

  document.querySelectorAll('.gradebtn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.gradebtn').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      state.grade = +b.dataset.g;
      render();
    });
  });
  document.getElementById('fCat').addEventListener('change', function (e) { state.cat = e.target.value; render(); });
  document.getElementById('fAcc').addEventListener('change', function (e) { state.acc = e.target.value; render(); });
  document.getElementById('fDate').addEventListener('change', function (e) { state.date = e.target.value; render(); });
  document.getElementById('fSearch').addEventListener('input', function (e) { state.q = e.target.value.trim(); render(); });

  var latest = D.posts.length ? kstTime(D.posts[0].time) : '아직 수집된 글 없음';
  document.getElementById('meta').textContent = '최근 글: ' + latest + ' (KST)';
  render();
})();
</script>
</body>
</html>
