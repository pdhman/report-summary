<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket 매크로 워치</title>
<style>
  .viz-root{
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --surface-2:#f1f1ee;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --pos:#2a78d6; --neg:#e34948;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-text:#006300;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])) .viz-root{
      color-scheme: dark;
      --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232322;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --pos:#3987e5; --neg:#e66767;
      --good-text:#0ca30c;
    }
  }
  :root[data-theme="dark"] .viz-root{
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232322;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --pos:#3987e5; --neg:#e66767;
    --good-text:#0ca30c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
       background:#f9f9f7;color:#0b0b0b;padding-bottom:84px;}
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])) body{background:#0d0d0d;color:#ffffff;}
  }
  :root[data-theme="dark"] body{background:#0d0d0d;color:#ffffff;}
  a{color:inherit;text-decoration:none} a:hover{text-decoration:underline}
  .viz-root{max-width:1120px;margin:0 auto;padding:28px 20px 40px;}
  header h1{font-size:22px;margin:0 0 4px;}
  header .sub{color:var(--text-secondary);font-size:13px;line-height:1.6}
  .num{font-variant-numeric:tabular-nums}
  .up{color:var(--good-text)} .down{color:var(--critical)} .flat{color:var(--text-muted)}

  /* 레짐 배너 */
  .regime{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;
    background:var(--surface-1);border:1px solid var(--border);border-left:8px solid var(--rc,var(--baseline));
    border-radius:12px;padding:16px 18px;margin:18px 0 12px;}
  .regime .big{font-size:40px;line-height:1}
  .regime h2{margin:0 0 4px;font-size:19px}
  .regime .axes{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;
    padding:3px 10px;font-size:12.5px;background:var(--surface-2);color:var(--text-secondary)}
  .pill b{color:var(--text-primary)}
  .regime .sigs{font-size:13px;color:var(--text-secondary);margin-top:4px}
  .regime .sigs b{color:var(--text-primary)}
  @media(max-width:600px){.regime{grid-template-columns:1fr}.regime .big{font-size:30px}}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 8px;}
  .tile{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:13px 15px;}
  .tile .label{font-size:12.5px;color:var(--text-secondary);}
  .tile .value{font-size:26px;font-weight:600;margin:2px 0;line-height:1.15}
  .tile .value small{font-size:14px;font-weight:500;color:var(--text-secondary)}
  .tile .delta{font-size:12px;color:var(--text-muted);}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .chip{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--border);
    border-radius:8px;padding:4px 9px;background:var(--surface-1);color:var(--text-secondary)}
  .chip b{color:var(--text-primary);font-weight:600}

  section{margin-top:32px;}
  section>h2{font-size:17px;margin:0 0 2px;}
  section>.desc{font-size:13px;color:var(--text-secondary);margin:0 0 12px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;align-items:start;}
  @media(max-width:760px){.cards{grid-template-columns:1fr;}}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px 12px;min-width:0}
  .card.wide{grid-column:1/-1}
  .card h3{font-size:13.5px;margin:0 0 2px;font-weight:600;line-height:1.35}
  .card h3 a:hover{color:var(--s1)}
  .card .meta{font-size:11.5px;color:var(--text-muted);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px 12px}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary)}
  .badge.A{color:var(--good-text)} .badge.B{color:var(--text-primary)} .badge.X{color:var(--text-muted)}
  .badge.alert{background:var(--critical);color:#fff;border-color:transparent}
  .badge.pol{font-weight:500}
  .badge.pol.risk{color:var(--critical)} .badge.pol.calm{color:var(--good-text)}
  .badge.band-Interest{color:var(--s1)} .badge.band-Tactical{color:var(--s2)} .badge.band-Strong,.badge.band-Event{color:var(--critical);font-weight:700}

  /* 분포 막대 */
  .dist{display:grid;grid-template-columns:minmax(80px,auto) 1fr 52px 56px;gap:4px 10px;align-items:center;font-size:12.5px}
  .dist .lb{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dist .lb.top{color:var(--text-primary);font-weight:600}
  .dist .bar{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
  .dist .bar i{display:block;height:100%;border-radius:3px}
  .dist .p{text-align:right;font-weight:600}
  .dist .d{text-align:right;font-size:11.5px}
  .mean{display:flex;gap:14px;align-items:baseline;margin:2px 0 8px;font-size:13px;color:var(--text-secondary)}
  .mean b{font-size:18px;color:var(--text-primary)}

  /* 바이너리 카드 */
  .bin{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
  .bin .big{font-size:30px;font-weight:600;line-height:1}
  .bin .ds{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--text-muted)}
  .bin .ds b{font-weight:600}
  .spark{display:block;width:100%;height:44px;margin-top:6px}

  /* 신호 표 */
  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap;
        font-variant-numeric:tabular-nums;color:var(--text-secondary);}
  th{color:var(--text-muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface-1)}
  th.sorted{color:var(--text-primary)}
  th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2){text-align:left}
  td:nth-child(2){white-space:normal;min-width:260px;color:var(--text-primary)}
  tr.alert td{background:color-mix(in srgb,var(--critical) 8%,transparent)}
  td .sub{display:block;font-size:11px;color:var(--text-muted)}
  .morebtn{margin-top:8px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface-1);
    color:var(--text-secondary);cursor:pointer;font-size:12.5px;font-family:inherit}
  .cbtable{font-size:12.5px} .cbtable td:nth-child(2){min-width:0}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 4px;font-size:12px;color:var(--text-secondary);}
  .legend .key{display:inline-flex;align-items:center;gap:5px;}
  .legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .chart{position:relative;} .chart svg{display:block;width:100%;}
  .tooltip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);
           border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 3px 12px rgba(0,0,0,.12);
           display:none;z-index:5;min-width:130px;}
  .tooltip .tx{color:var(--text-muted);margin-bottom:3px;}
  .tooltip .row{display:flex;align-items:center;gap:6px;justify-content:space-between;color:var(--text-secondary);}
  .tooltip .row b{color:var(--text-primary);font-weight:600;}
  details.tbl{margin:4px 0 6px;} details.tbl summary{font-size:12px;color:var(--text-muted);cursor:pointer;}
  .empty{padding:22px 10px;text-align:center;color:var(--text-muted);font-size:13px;border:1px dashed var(--grid);border-radius:8px;margin:8px 0;}
  .alertbox{border:1px solid color-mix(in srgb,var(--critical) 40%,transparent);background:color-mix(in srgb,var(--critical) 6%,transparent);
    border-radius:10px;padding:12px 14px;margin:14px 0 0;font-size:13px}
  .alertbox h3{margin:0 0 6px;font-size:14px}
  .alertbox li{margin:3px 0}
  footer{margin-top:40px;font-size:12px;color:var(--text-muted);line-height:1.7;}
  footer b{color:var(--text-secondary)}
  #theme-toggle{position:fixed;top:14px;right:14px;z-index:60;width:38px;height:38px;
    border-radius:50%;border:1px solid var(--border);background:var(--surface-1);font-size:16px;
    line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.12);transition:border-color .15s;padding:0;}
  #theme-toggle:hover{border-color:var(--s1);}
</style>
</head>
<body>
<div class="viz-root">
  <button id="theme-toggle" aria-label="테마 전환" onclick="_tgTheme()">🌓</button>
  <script>
  function _tgCur(){var t=document.documentElement.dataset.theme;if(t)return t;
    return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  function _tgSync(){var b=document.getElementById('theme-toggle');if(b)b.textContent=_tgCur()==='dark'?'☀️':'🌙';}
  function _tgTheme(){var next=_tgCur()==='dark'?'light':'dark';document.documentElement.dataset.theme=next;
    try{localStorage.setItem('theme',next);}catch(e){}_tgSync();if(typeof renderAll==='function')renderAll();}
  (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.dataset.theme=t;}}catch(e){}_tgSync();})();
  </script>

  <header>
    <h1>🎯 Polymarket 매크로 워치</h1>
    <div class="sub">예측시장 확률로 읽는 매크로 — <b>연준</b> · <b>물가</b> · <b>성장·고용</b> · <b>지정학</b> · <b>PMSS 신호</b>

  </header>

  <div class="regime" id="regime"></div>
  <div class="tiles" id="tiles"></div>
  <div class="chips" id="assets"></div>
  <div id="alerts"></div>

  <div id="groups"></div>

  <section>
    <h2>PMSS 신호 랭킹</h2>
    <p class="desc">Probability Shock 30 · Cross-Asset 30 · Liquidity 15 · Persistence 15 · Importance 10 — 열 제목 클릭으로 정렬. 붉은 행 = 알림 조건 충족</p>
    <div class="card wide"><div class="tblwrap" id="sigTable"></div><button class="morebtn" id="moreBtn" hidden>전체 보기</button></div>
  </section>

  <section>
    <h2>추이</h2>
    <p class="desc">핵심 시장의 전기간 일봉(Polymarket CLOB) · 레짐 축 점수는 실행마다 누적</p>
    <div class="cards" id="trend"></div>
  </section>

  <footer id="foot"></footer>
</div>

function spark(h, color){
  if(!h||h.length<2) return '';
  const W=300,H=44,P=3; const t0=h[0][0],t1=h[h.length-1][0]; const ps=h.map(x=>x[1]);
  let lo=Math.min(...ps),hi=Math.max(...ps); if(hi-lo<0.02){const m=(hi+lo)/2;lo=m-0.01;hi=m+0.01;}
  const X=t=>P+(W-2*P)*(t-t0)/Math.max(1,t1-t0), Y=p=>P+(H-2*P)*(1-(p-lo)/(hi-lo));
  const d=h.map((x,i)=>(i?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join('');
  const last=h[h.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3" fill="${color}"/>
    <text x="${P}" y="${H-1}" font-size="9" fill="${INK.muted}">7일 · 저 ${pct(lo)} · 고 ${pct(hi)}</text></svg>`;

      <div class="bar"><i style="width:${Math.max(0.5,m.prob*100).toFixed(1)}%;background:${col};opacity:${op}"></i></div>
      <div class="p num">${pct(m.prob)}</div><div class="d">${dp(m.d24)}</div>`;}).join('');

/* ── 라인 차트 (crypto 모니터와 동일 스펙) ── */
function niceTicks(min,max,n=5){
  if(min===max){min-=1;max+=1;}
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n+1)||mag*10;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, out=[];
  for(let v=lo;v<=hi+1e-9;v+=step) out.push(+v.toFixed(10));
  return out;
}
const svgEl=(t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e;};
function lineChart(elId, series, opts={}){
  const host=document.getElementById(elId); if(!host) return;
  host.innerHTML='';
  series=series.filter(s=>s&&s.values&&s.values.some(v=>v!=null));
  if(!series.length){host.innerHTML='<div class="empty">데이터 없음</div>';return;}
  if(series.length>1){
    const d0=series[0].dates;
    if(series.some(s=>s.dates.length!==d0.length||s.dates[0]!==d0[0]||s.dates[s.dates.length-1]!==d0[d0.length-1])){
      const all=[...new Set([].concat(...series.map(s=>s.dates)))].sort();
      series=series.map(s=>{const idx={};s.dates.forEach((d,i)=>idx[d]=s.values[i]);return {name:s.name,dates:all,values:all.map(d=>idx[d]??null)};});
    }
  }
  const labels=series[0].dates, unit=opts.unit||'', dec=opts.dec??1, tdec=opts.tdec??dec;
  const slots=opts.slots||series.map((_,i)=>i%4);
  const xl=opts.xl||((d,n)=>n<=130?String(d).slice(5,10):String(d).slice(0,7));
  if(series.length>1){const lg=document.createElement('div');lg.className='legend';
    series.forEach((s,i)=>lg.insertAdjacentHTML('beforeend',`<span class="key"><span class="sw" style="background:${SLOT[slots[i]]}"></span>${esc(s.name)}</span>`));host.appendChild(lg);}
  const wrap=document.createElement('div');wrap.className='chart';host.appendChild(wrap);
  const W=Math.max(320,host.clientWidth||430), H=opts.h||210, n=labels.length;
  const allV=series.flatMap(s=>s.values).filter(v=>v!=null);
  let lo=Math.min(...allV), hi=Math.max(...allV);
  if(opts.ymin!=null) lo=Math.min(lo,opts.ymin); if(opts.ymax!=null) hi=Math.max(hi,opts.ymax);
  const ticks=niceTicks(lo,hi,4), ymin=ticks[0], ymax=ticks[ticks.length-1];
  const lw=Math.max(...ticks.map(t=>fmt(t,dec).length))*6.4+12;
  const M={t:14,r:56,b:26,l:Math.max(40,Math.ceil(lw))};
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H}); wrap.appendChild(svg);
  const tip=document.createElement('div');tip.className='tooltip';wrap.appendChild(tip);
  const X=i=>M.l+(n<=1?0:(W-M.l-M.r)*i/(n-1)), Y=v=>M.t+(H-M.t-M.b)*(1-(v-ymin)/(ymax-ymin));
  ticks.forEach(t=>{svg.appendChild(svgEl('line',{x1:M.l,x2:W-M.r,y1:Y(t),y2:Y(t),stroke:INK.grid,'stroke-width':1}));
    const tx=svgEl('text',{x:M.l-6,y:Y(t)+4,'text-anchor':'end','font-size':10.5,fill:INK.muted});tx.textContent=fmt(t,dec)+unit;svg.appendChild(tx);});
  svg.appendChild(svgEl('line',{x1:M.l,x2:W-M.r,y1:Y(ymin),y2:Y(ymin),stroke:INK.baseline,'stroke-width':1}));
  (opts.guides||[]).forEach(g=>{if(g.v<ymin||g.v>ymax)return;
    svg.appendChild(svgEl('line',{x1:M.l,x2:W-M.r,y1:Y(g.v),y2:Y(g.v),stroke:INK.baseline,'stroke-width':1}));
    const t=svgEl('text',{x:W-M.r+4,y:Y(g.v)+4,'font-size':10,fill:INK.muted});t.textContent=g.label;svg.appendChild(t);});
  const xtick=Math.max(1,Math.round(n/6));
  for(let i=0;i<n;i+=xtick){const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle','font-size':10.5,fill:INK.muted});t.textContent=xl(labels[i],n);svg.appendChild(t);}
  const usedY=[];
  series.forEach((s,si)=>{const col=SLOT[slots[si]];
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]);
    const d=pts.map((p,i)=>p?(i&&pts[i-1]?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1):'').join('');
    svg.appendChild(svgEl('path',{d,fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    const last=pts.filter(Boolean).pop();
    if(last){svg.appendChild(svgEl('circle',{cx:last[0],cy:last[1],r:4,fill:col,stroke:INK.surface,'stroke-width':2}));
      const lv=s.values.filter(v=>v!=null).pop(); const txt=fmt(lv,tdec)+unit;
      if(!usedY.some(y=>Math.abs(y-last[1])<12)&&last[0]+8+String(txt).length*6.6<=W-2){
        const t=svgEl('text',{x:last[0]+8,y:last[1]+4,'font-size':11,fill:INK.secondary});t.textContent=txt;svg.appendChild(t);usedY.push(last[1]);}}
  });
  const cross=svgEl('line',{y1:M.t,y2:H-M.b,stroke:INK.baseline,'stroke-width':1,visibility:'hidden'});svg.appendChild(cross);
  svg.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.round((x-M.l)/((W-M.l-M.r)/Math.max(1,n-1)))));
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('visibility','visible');
    tip.style.display='block';
    tip.innerHTML=`<div class="tx">${esc(labels[i])}</div>`+series.map((s,si)=>`<div class="row"><span class="key"><span class="sw" style="background:${SLOT[slots[si]]};width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px"></span>${esc(s.name)}</span><b>${fmt(s.values[i],tdec)}${unit}</b></div>`).join('');
    const px=X(i)*r.width/W; tip.style.left=(px>r.width*0.6?px-tip.offsetWidth-12:px+12)+'px'; tip.style.top='14px';});
  svg.addEventListener('mouseleave',()=>{tip.style.display='none';cross.setAttribute('visibility','hidden');});
  const det=document.createElement('details');det.className='tbl';det.innerHTML='<summary>표 보기</summary>';
  const tb=document.createElement('table');tb.innerHTML='<tr><th>날짜</th>'+series.map(s=>`<th>${esc(s.name)}</th>`).join('')+'</tr>';
  const step=Math.max(1,Math.round(n/12));
  for(let i=0;i<n;i+=step) tb.insertAdjacentHTML('beforeend',`<tr><td>${esc(labels[i])}</td>`+series.map(s=>`<td>${fmt(s.values[i],tdec)}${unit}</td>`).join('')+'</tr>');
  det.appendChild(tb);host.appendChild(det);
}

(function(){
  if(!/^https?:$/.test(location.protocol)) return;   // file:// 등에서는 동작 안 함
  var POLL = 5 * 60 * 1000;                          // 5분마다 확인
  var tag = null;
  function stamp(res){
    return res.headers.get('etag') || res.headers.get('last-modified')
        || res.headers.get('content-length');
  }
  function check(){
    fetch(location.pathname, { method:'HEAD', cache:'no-store' }).then(function(res){
      if(!res.ok) return;
      var s = stamp(res);
      if(!s) return;                  // 판별 정보가 없으면 새로고침하지 않는다
      if(tag === null){ tag = s; return; }   // 첫 확인은 기준값만 기록
      if(s !== tag){ location.reload(); }
    }).catch(function(){});
  }
  window.__checkUpdate = check;       // 콘솔에서 즉시 확인용
  check();
  setInterval(check, POLL);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') check();
  });
})();
