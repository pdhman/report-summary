name: Daily Report Insights

on:
  workflow_run:
    # 크롤러(Daily Report Summary)가 끝나면 곧바로 실행 — 스케줄 지연이 커도
    # 항상 "크롤링 → 인사이트" 순서가 보장된다.
    workflows: ["Daily Report Summary"]
    types: [completed]
  schedule:
    # 백업 스케줄. UTC 01:37 = 한국시간(KST) 오전 10:37
    # 정각(01:00 UTC)은 예약 작업이 몰려 지연·누락되기 쉬워 37분으로 비껴둠
    - cron: "37 1 * * *"
    # 한국 장 마감(15:30 KST) 이후 재수집. UTC 07:33 = KST 16:33
    # 오전 실행 때 한국 종목은 장중 미완성 봉이 담기므로, 마감 뒤 한 번 더 돌려
    # 그날 확정 종가로 덮어쓴다. (미국 종목은 이미 전일 확정치라 변화 없음)
    - cron: "33 7 * * *"
  workflow_dispatch: {} # 깃허브에서 수동 실행 버튼 제공
  push:
    branches: [main]
    # 소스/코드 변경 시에만 재배포. 봇이 만드는 reports/ 커밋은 제외해 무한루프 방지.
    paths:
      - "**.py"
      # aicyclemonitor 는 전용 워크플로우(weekly-aicycle)가 배포 — 여기서 제외해
      # 두 워크플로우가 동시에 Pages를 배포하며 서로 덮어쓰는 경쟁을 방지
      - "!aicyclemonitor/**"
      - "requirements.txt"
      - ".github/workflows/daily-insights.yml"
      - "briefs/**" # 시황 브리핑 붙여넣고 푸시하면 자동 배포
      - "reports/**" # 로컬 스크리너가 리포트를 push 하면 사이트 재배포 (봇 커밋은 [skip ci]로 제외)
      - "blog/**" # 블로그(투자전략) 본문 갱신 시 재배포

# 생성된 HTML 커밋(contents) + GitHub Pages 배포(pages, id-token)
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-insights
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build insights (드라이브 xlsx → HTML)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          PYTHONUTF8: "1"
          MPLBACKEND: Agg
        run: python sync_report_summary.py

      # 분석 탭(차트·계절성)이 서버 없이 동작하도록 기본 티커 일봉을 정적 파일로 굽는다.
      # 야후가 러너 IP를 일시 차단해도 스크립트가 기존 데이터를 유지하므로,
      # 실패해도 배포는 계속한다(continue-on-error).
      - name: Build market data (분석 탭 정적 데이터)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: python seasonality/fetch_data.py

      - name: Commit generated reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "insights: $(date -u +%Y-%m-%d) 자동 생성 [skip ci]"
            # push 이벤트 실행과 수동 트리거 실행이 동시에 돌면 push 경쟁이
            # 생긴다. 리베이스 후 재시도하고, 그래도 밀리면(다른 실행이 이미
            # 같은 내용을 커밋함) 배포는 계속 진행한다 — 실패로 처리하지 않음.
            git pull --rebase -X theirs origin main || true
            git push || echo "push 건너뜀 (동시 실행이 먼저 커밋함) — 배포는 계속"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports # index.html 이 랜딩 페이지

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
