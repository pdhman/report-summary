name: Daily Report Insights

# 2026-08-22 부터 사이트는 GitHub Pages "브랜치 서빙"(main /docs)으로 자동
# 배포된다 — 커밋을 push 하면 그 자체가 배포다. 그래서 이 워크플로는
# '클라우드에서 인사이트 HTML 을 생성해 커밋'하는 일만 하고, Pages 배포
# 잡은 없다. (예전 Actions 배포 방식은 배포 잡이 직렬이라 로컬 파이프라인
# 7~8개가 push 할 때마다 잡이 쌓여 대기·취소·경쟁이 났다.)

on:
  workflow_run:
    # 크롤러(Daily Report Summary)가 끝나면 곧바로 실행 — 스케줄 지연이 커도
    # 항상 "크롤링 → 인사이트" 순서가 보장된다.
    workflows: ["Daily Report Summary"]
    types: [completed]
  schedule:
    # 백업 스케줄. UTC 01:37 = 한국시간(KST) 오전 10:37
    # 정각(01:00 UTC)은 예약 작업이 몰려 지연·누락되기 쉬워 37분으로 비껴둠
    - cron: "37 1 * * *"
    # 한국 장 마감(15:30 KST) 이후 재수집. UTC 07:33 = KST 16:33
    # 오전 실행 때 한국 종목은 장중 미완성 봉이 담기므로, 마감 뒤 한 번 더 돌려
    # 그날 확정 종가로 덮어쓴다. (미국 종목은 이미 전일 확정치라 변화 없음)
    - cron: "33 7 * * *"
  workflow_dispatch: {} # 깃허브에서 수동 실행 버튼 제공
  # push 트리거는 제거 — 브랜치 서빙에서는 push = 배포라, 여기서 다시 돌 이유가
  # 소스 변경 시 인사이트 재생성뿐인데 그건 다음 스케줄 실행이 해준다.

permissions:
  contents: write

concurrency:
  group: daily-insights
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build insights (드라이브 xlsx → HTML)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          PYTHONUTF8: "1"
          MPLBACKEND: Agg
        run: python sync_report_summary.py

      # 분석 탭(차트·계절성)이 서버 없이 동작하도록 기본 티커 일봉을 정적 파일로 굽는다.
      # 야후가 러너 IP를 일시 차단해도 스크립트가 기존 데이터를 유지하므로,
      # 실패해도 커밋은 계속한다(continue-on-error).
      - name: Build market data (분석 탭 정적 데이터)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: |
          python seasonality/fetch_data.py
          # 검색용 KRX 전종목 이름·코드 목록(신규 상장·사명 변경 반영)
          python seasonality/build_krx_index.py

      - name: Commit generated docs (push = 배포)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "insights: $(date -u +%Y-%m-%d) 자동 생성 [skip ci]"
            # 로컬 파이프라인과 push 경쟁이 나면 리베이스 후 최대 3회 재시도
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || true
              sleep 5
            done
          fi
