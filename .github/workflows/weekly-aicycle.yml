name: Weekly AI Cycle Monitor

on:
  schedule:
    # UTC 일 23:41 = KST 월요일 08:41 (정각은 러너 지연이 잦아 41분으로 비껴둠)
    - cron: "41 23 * * 0"
  workflow_dispatch: {} # 깃허브에서 수동 실행 버튼 제공
  push:
    branches: [main]
    paths:
      - "aicyclemonitor/**"
      - ".github/workflows/weekly-aicycle.yml"

# 히스토리 CSV·대시보드 커밋 — 사이트는 브랜치 서빙(main /docs)이라 push 가 곧 배포
permissions:
  contents: write

concurrency:
  group: weekly-aicycle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas requests

      # FRED·vast.ai는 러너(데이터센터 IP)에서도 차단 — 스크립트 내장 폴백
      # (allorigins 프록시 + FRED 캐시, 500.farm 미러)이 실제 수집을 담당
      - name: Run monitor
        env:
          PYTHONUTF8: "1"
        run: python aicyclemonitor/ai_cycle_monitor.py

      - name: Publish dashboard into docs/
        run: cp aicyclemonitor/dashboard.html docs/aicycle.html

      - name: Commit history + dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aicyclemonitor docs/aicycle.html
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "aicycle: $(date -u +%Y-%m-%d) 주간 갱신 [skip ci]"
            # 다른 워크플로우·로컬 파이프라인과 push 경쟁 시 리베이스 후 재시도
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || true
              sleep 5
            done
          fi
