<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 차트</title>
<script src="lib/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --pos: #16a34a;
    --neg: #dc2626;
    --accent: #eb6834;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--page); color: var(--ink); padding: 24px 28px 40px;
  }
  a.navlink { color: var(--muted); text-decoration: none; font-size: 13px; }
  a.navlink:hover { color: var(--accent); }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .searchbox { display: flex; gap: 0; }
  .searchbox input {
    font-size: 14px; padding: 9px 14px; width: 280px;
    border: 1px solid var(--grid); border-right: none; border-radius: 10px 0 0 10px;
    background: #fff; color: var(--ink); outline: none;
    font-family: Consolas, monospace; text-transform: uppercase;
  }
  .searchbox input:focus { border-color: var(--accent); }
  .searchbox button {
    font-size: 14px; padding: 9px 18px; border: none; border-radius: 0 10px 10px 0;
    background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    font-size: 12px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--grid); background: #fff; color: var(--ink-2);
    cursor: pointer; user-select: none; font-family: Consolas, monospace;
  }
  .chip:hover { border-color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
  }
  .pricehead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .pricehead .nm { font-size: 18px; font-weight: 700; }
  .pricehead .sym { font-size: 12px; color: var(--muted); border: 1px solid var(--grid); border-radius: 6px; padding: 2px 8px; font-family: Consolas, monospace; }
  .pricehead .px { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pricehead .chg { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--pos); } .down { color: var(--neg); }
  .toolrow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .toolrow .lbl { font-size: 11px; color: var(--muted); margin-right: 6px; }
  .right-tools { display: flex; gap: 6px; align-items: center; }
  button.plain {
    font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--grid); background: #fff; color: var(--ink-2);
  }
  button.plain:hover { border-color: var(--muted); }
  button.plain.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #chartWrap { position: relative; }
  #chartEl { width: 100%; height: 560px; }
  #legend {
    position: absolute; top: 8px; left: 10px; z-index: 5; pointer-events: none;
    font-size: 12px; color: var(--ink-2); background: rgba(252,252,251,0.85);
    border-radius: 6px; padding: 4px 8px; font-variant-numeric: tabular-nums;
  }
  #legend b { color: var(--ink); }
  #status { font-size: 13px; color: var(--muted); padding: 30px 0; text-align: center; }
  #status.err { color: var(--neg); }
  .attrib { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .attrib a { color: var(--muted); }
</style>
</head>
<body>
  <div class="topbar">
    <h1>📈 주식 차트 <a class="navlink" href="/">☀️ 계절성 분석으로 →</a></h1>
    <div>
      <div class="searchbox">
        <input id="symInput" placeholder="티커 입력 (예: AAPL, 005930.KS, BTC-USD)" spellcheck="false">
        <button id="goBtn">조회</button>
      </div>
      <div class="chips" id="presets" style="margin-top:8px">
        <span class="chip" data-s="SPY">SPY</span>
        <span class="chip" data-s="QQQ">QQQ</span>
        <span class="chip" data-s="AAPL">AAPL</span>
        <span class="chip" data-s="NVDA">NVDA</span>
        <span class="chip" data-s="TSLA">TSLA</span>
        <span class="chip" data-s="005930.KS">005930.KS</span>
        <span class="chip" data-s="069500.KS">069500.KS</span>
        <span class="chip" data-s="BTC-USD">BTC-USD</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="pricehead" id="priceHead" style="display:none">
      <span class="nm" id="phName"></span>
      <span class="sym" id="phSym"></span>
      <span class="px" id="phPx"></span>
      <span class="chg" id="phChg"></span>
      <span style="font-size:12px;color:var(--muted)" id="phDate"></span>
    </div>
  </div>

  <div class="card">
    <div class="toolrow">
      <div class="chips" id="periodBtns">
        <span class="lbl">기간</span>
        <span class="chip" data-p="1M">1M</span>
        <span class="chip" data-p="3M">3M</span>
        <span class="chip" data-p="6M">6M</span>
        <span class="chip on" data-p="1Y">1Y</span>
        <span class="chip" data-p="3Y">3Y</span>
        <span class="chip" data-p="5Y">5Y</span>
        <span class="chip" data-p="ALL">All</span>
      </div>
      <div class="right-tools">
        <button class="plain" id="csvBtn">⬇ CSV</button>
        <button class="plain on" id="linBtn">Linear</button>
        <button class="plain" id="logBtn">Log</button>
      </div>
    </div>
    <div class="toolrow" style="justify-content:flex-start">
      <div class="chips" id="smaBtns"><span class="lbl">SMA</span></div>
      <div class="chips" id="emaBtns" style="margin-left:14px"><span class="lbl">EMA</span></div>
    </div>
    <div id="chartWrap">
      <div id="chartEl"></div>
      <div id="legend" style="display:none"></div>
      <div id="status">티커를 입력하거나 위 버튼을 눌러 조회하세요.</div>
    </div>
    <div class="attrib">차트: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts</a> · 데이터: Yahoo Finance (지연/무보증) · 과거 성과는 미래를 보장하지 않습니다.</div>
  </div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmtN = (v, d=2) => v == null ? "·" : v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtVol = v => v >= 1e9 ? (v/1e9).toFixed(2)+"B" : v >= 1e6 ? (v/1e6).toFixed(2)+"M" : v >= 1e3 ? (v/1e3).toFixed(1)+"K" : String(v);

// 이동평균선 설정: [기간, 색, 기본 표시 여부]
const SMA_DEFS = [[5,"#898781",0],[10,"#1baf7a",0],[20,"#eb6834",1],[50,"#2a78d6",1],[60,"#eda100",0],[120,"#e87ba4",0],[200,"#4a3aa7",1]];
const EMA_DEFS = [[9,"#0e7490",0],[21,"#a16207",0],[65,"#9d174d",0]];

let chart = null, candleSeries = null, volSeries = null;
let bars = [];            // 현재 종목 전체 일봉
let curSymbol = null, curMeta = {};
const maSeries = {};      // "S20" / "E9" → line series
let activePeriod = "1Y", logScale = false;

function initChart() {
  chart = LightweightCharts.createChart($("chartEl"), {
    layout: { background: { color: "#fcfcfb" }, textColor: "#52514e",
              fontFamily: 'Consolas, "Malgun Gothic", monospace' },
    grid: { vertLines: { color: "#f1f0ec" }, horzLines: { color: "#f1f0ec" } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: "#e1e0d9" },
    timeScale: { borderColor: "#e1e0d9", rightOffset: 3 },
    autoSize: true,
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: "#16a34a", downColor: "#dc2626", borderVisible: false,
    wickUpColor: "#16a34a", wickDownColor: "#dc2626",
  });
  volSeries = chart.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

  chart.subscribeCrosshairMove(p => {
    const lg = $("legend");
    if (!p.time || !p.seriesData.has(candleSeries)) { lg.style.display = "none"; return; }
    const d = p.seriesData.get(candleSeries);
    const bar = barByTime.get(p.time);
    const chg = bar && bar.prevC ? (d.close / bar.prevC - 1) * 100 : null;
    lg.innerHTML = `<b>${p.time}</b> · 시 ${fmtN(d.open)} 고 ${fmtN(d.high)} 저 ${fmtN(d.low)} 종 <b>${fmtN(d.close)}</b>` +
      (chg === null ? "" : ` <b class="${chg >= 0 ? "up" : "down"}">${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</b>`) +
      (bar ? ` · 량 ${fmtVol(bar.v)}` : "");
    lg.style.display = "block";
  });
}

let barByTime = new Map();

function sma(period) {
  const out = []; let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i].c;
    if (i >= period) sum -= bars[i - period].c;
    if (i >= period - 1) out.push({ time: bars[i].t, value: sum / period });
  }
  return out;
}
function ema(period) {
  const out = []; const k = 2 / (period + 1); let e = null;
  for (let i = 0; i < bars.length; i++) {
    e = e === null ? bars[i].c : bars[i].c * k + e * (1 - k);
    if (i >= period - 1) out.push({ time: bars[i].t, value: e });
  }
  return out;
}

function setMA(kind, period, color, on) {
  const key = kind + period;
  if (on && !maSeries[key]) {
    maSeries[key] = chart.addLineSeries({ color, lineWidth: 1.6, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
    maSeries[key].setData(kind === "S" ? sma(period) : ema(period));
  } else if (!on && maSeries[key]) {
    chart.removeSeries(maSeries[key]);
    delete maSeries[key];
  }
}

function refreshMAs() {
  for (const key of Object.keys(maSeries)) {
    const kind = key[0], period = +key.slice(1);
    maSeries[key].setData(kind === "S" ? sma(period) : ema(period));
  }
}

function buildMAButtons() {
  for (const [defs, kind, wrap] of [[SMA_DEFS, "S", $("smaBtns")], [EMA_DEFS, "E", $("emaBtns")]]) {
    for (const [p, color, def] of defs) {
      const b = document.createElement("span");
      b.className = "chip" + (def ? " on" : "");
      b.textContent = p;
      if (def) b.style.cssText = `background:${color};border-color:${color}`;
      b.addEventListener("click", () => {
        const on = !b.classList.contains("on");
        b.classList.toggle("on", on);
        b.style.cssText = on ? `background:${color};border-color:${color};color:#fff` : "";
        if (bars.length) setMA(kind, p, color, on);
      });
      b.dataset.kind = kind; b.dataset.p = p; b.dataset.color = color;
      wrap.appendChild(b);
    }
  }
}

function applyPeriod() {
  if (!bars.length) return;
  if (activePeriod === "ALL") { chart.timeScale().fitContent(); return; }
  const days = { "1M": 31, "3M": 92, "6M": 183, "1Y": 366, "3Y": 1096, "5Y": 1827 }[activePeriod];
  const last = new Date(bars[bars.length - 1].t);
  const from = new Date(last); from.setDate(from.getDate() - days);
  const fromStr = from.toISOString().slice(0, 10);
  chart.timeScale().setVisibleRange({ from: fromStr, to: bars[bars.length - 1].t });
}

async function load(symbol) {
  symbol = symbol.trim().toUpperCase();
  if (!symbol) return;
  $("status").style.display = "block";
  $("status").className = "";
  $("status").textContent = `${symbol} 불러오는 중...`;
  try {
    const res = await fetch(`/api/ohlcv?symbol=${encodeURIComponent(symbol)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    curSymbol = symbol; curMeta = data;
    bars = data.bars;
    barByTime = new Map();
    for (let i = 0; i < bars.length; i++) {
      bars[i].prevC = i > 0 ? bars[i - 1].c : null;
      barByTime.set(bars[i].t, bars[i]);
    }
    candleSeries.setData(bars.map(b => ({ time: b.t, open: b.o, high: b.h, low: b.l, close: b.c })));
    volSeries.setData(bars.map(b => ({ time: b.t, value: b.v, color: b.c >= b.o ? "rgba(22,163,74,0.4)" : "rgba(220,38,38,0.4)" })));
    refreshMAs();
    // 기본 표시 이평선이 아직 없다면 생성
    document.querySelectorAll("#smaBtns .chip.on, #emaBtns .chip.on").forEach(b =>
      setMA(b.dataset.kind, +b.dataset.p, b.dataset.color, true));
    applyPeriod();
    // 가격 헤더
    const lastB = bars[bars.length - 1], prevC = bars.length > 1 ? bars[bars.length - 2].c : lastB.c;
    const chg = lastB.c - prevC, chgPct = prevC ? chg / prevC * 100 : 0;
    $("priceHead").style.display = "flex";
    $("phName").textContent = data.name;
    $("phSym").textContent = symbol;
    $("phPx").textContent = `${fmtN(lastB.c)} ${data.currency}`;
    $("phChg").textContent = `${chg >= 0 ? "▲" : "▼"} ${fmtN(Math.abs(chg))} (${chg >= 0 ? "+" : ""}${chgPct.toFixed(2)}%)`;
    $("phChg").className = "chg " + (chg >= 0 ? "up" : "down");
    $("phDate").textContent = `${bars[0].t} ~ ${lastB.t} · ${bars.length.toLocaleString()}일`;
    $("status").style.display = "none";
    $("symInput").value = symbol;
    localStorage.setItem("chart.symbol", symbol);
    document.title = `${symbol} 차트`;
    document.querySelectorAll("#presets .chip").forEach(c => c.classList.toggle("on", c.dataset.s === symbol));
  } catch (e) {
    $("status").className = "err";
    $("status").textContent = `오류: ${e.message}`;
  }
}

function exportCSV() {
  if (!bars.length) return;
  const L = ["date,open,high,low,close,volume"];
  for (const b of bars) L.push(`${b.t},${b.o},${b.h},${b.l},${b.c},${b.v}`);
  const blob = new Blob([L.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${curSymbol}_daily.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function init() {
  initChart();
  buildMAButtons();
  $("goBtn").addEventListener("click", () => load($("symInput").value));
  $("symInput").addEventListener("keydown", e => { if (e.key === "Enter") load($("symInput").value); });
  document.querySelectorAll("#presets .chip").forEach(c =>
    c.addEventListener("click", () => load(c.dataset.s)));
  document.querySelectorAll("#periodBtns .chip").forEach(c =>
    c.addEventListener("click", () => {
      activePeriod = c.dataset.p;
      document.querySelectorAll("#periodBtns .chip").forEach(x => x.classList.toggle("on", x === c));
      applyPeriod();
    }));
  $("linBtn").addEventListener("click", () => setScale(false));
  $("logBtn").addEventListener("click", () => setScale(true));
  $("csvBtn").addEventListener("click", exportCSV);
  load(localStorage.getItem("chart.symbol") || "SPY");
}

function setScale(log) {
  logScale = log;
  chart.applyOptions({ rightPriceScale: { mode: log ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal } });
  $("linBtn").classList.toggle("on", !log);
  $("logBtn").classList.toggle("on", log);
}

init();
</script>
</body>
</html>
